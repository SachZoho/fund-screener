name: Deploy HTML
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and deploy
        run: |
          if [ -f deploy_data.txt ]; then
            base64 -d deploy_data.txt | gzip -d > index.html
            rm deploy_data.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Deploy self-contained app to GitHub Pages"
            git push
          fi
